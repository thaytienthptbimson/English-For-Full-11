<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiếng Anh lớp 11 – Global Success</title>
<style>
:root{--ink:#16313b;--mut:#5f7a84;--bg:#fdf1ef;--teal:#c0392b;--sun:#ffc83d;--coral:#ff6a5b;--sky:#dff1fb;--line:#f2d8d3}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Baloo 2","Trebuchet MS",ui-rounded,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:2.5rem}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #1b6ef3;outline-offset:2px}
header{background:var(--teal);color:#fff;padding:1.375rem 1rem 3.625rem;text-align:center}
header h1{margin:0;font-size:1.75rem}
header p{margin:0.25rem 0 0;opacity:.9}
#stat{display:inline-block;margin-top:0.625rem;background:rgba(255,255,255,.22);padding:0.25rem 0.875rem;border-radius:6.1875rem;font-weight:700;font-size:0.875rem}
main{max-width:35rem;margin:.75rem auto 0;padding:0 0.875rem}

#utitle{font-weight:800;font-size:1.125rem;margin:0 0.25rem 0.625rem}
#utitle small{display:block;color:var(--mut);font-weight:600;font-size:0.875rem}
#tabs{display:flex;background:#fff;border-radius:0.875rem;padding:0.25rem;gap:0.25rem;border:2px solid var(--line)}
#tabs button{flex:1;border:0;background:none;padding:0.5625rem 2px;border-radius:0.625rem;font-weight:700;font-size:0.875rem;color:var(--mut);cursor:pointer}
#tabs button.on{background:var(--teal);color:#fff}
.card{background:#fff;border-radius:1.5rem;padding:1.25rem 1.125rem 1.125rem;margin-top:0.75rem;text-align:center;border:2px solid var(--line);box-shadow:0 0.375rem 0 var(--line)}
.bar{height:0.5rem;background:var(--line);border-radius:0.5625rem;overflow:hidden}
#fill{display:block;height:100%;width:0;background:var(--coral);transition:width .3s}
#emoji{font-size:5.75rem;line-height:1.2;margin-top:0.75rem}
#tag{display:inline-block;padding:3px 0.75rem;border-radius:6.1875rem;font-size:0.8125rem;font-weight:800}
.t1{background:#fadbd6;color:#8a1f14}.t2{background:#fff0c2;color:#7a5600}.t3{background:var(--sky);color:#1f5f86}
#w{font-size:2.5rem;margin:0.5rem 0 2px;line-height:1.15;word-break:break-word}
#ipa{font:1.375rem "Times New Roman",serif;color:var(--coral);min-height:1.75rem}
#vn{font-size:1.3125rem;color:var(--mut);margin:0.25rem 0 0.625rem;font-weight:700}
#res{min-height:1.5rem;font-weight:800;margin:0.375rem 0}
.ok{color:#118a4e}.no{color:#c0392b}
.row{display:flex;gap:0.5rem;margin-top:0.5rem}
.row button,.big{flex:1;padding:0.8125rem 0.375rem;border:0;border-radius:0.875rem;font-weight:800;font-size:1rem;color:#fff;cursor:pointer;box-shadow:0 0.25rem 0 rgba(0,0,0,.18)}
.row button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.b1{background:#27ae60}.b2{background:#2d7fd3}.b3{background:#7c4dbb}.b4{background:#8a9aa0}
#know.done{background:var(--sun);color:#5a4200}
#cnt{color:var(--mut);font-size:0.875rem;margin:0.75rem 0 0}
.pop{animation:pop .22s}
@keyframes pop{from{transform:scale(.97)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}#fill{transition:none}}
#tg{width:100%;margin-top:1rem;background:var(--ink);padding:0.75rem}
#teach{display:none;background:#fff8dc;border:2px solid #f3dd8b;border-radius:1.125rem;padding:1rem;margin-top:0.625rem}
#teach h3{margin:0 0 0.625rem;text-align:center}
input{width:100%;padding:0.625rem;font-size:0.9375rem;border:2px solid var(--line);border-radius:0.625rem;margin-bottom:0.5rem}
.add{background:#e67e22;width:100%}
#msg{color:#118a4e;font-weight:700;text-align:center;margin:0.5rem 0 0;min-height:1.25rem}
#note{text-align:center;color:#b05a12;font-weight:700;font-size:0.875rem;margin-top:0.875rem}
#lock{display:none;position:fixed;inset:0;background:rgba(10,30,36,.6);justify-content:center;align-items:flex-start;padding:3.75rem 1.125rem;z-index:9}
.lc{background:#fff;border-radius:1.375rem;padding:1.625rem;max-width:26.25rem;width:100%;text-align:center;border-top:0.375rem solid var(--coral)}
.lc h2{margin:0 0 0.5rem}
#err{color:#c0392b;font-weight:700;min-height:1.25rem}

html{-webkit-text-size-adjust:100%;font-size:calc(clamp(15px,min(.8vw + 13px,2.2vh + 8px),30px)*var(--z,1))}
#zoom{display:inline-flex;align-items:center;gap:.25rem;background:rgba(255,255,255,.22);border-radius:6rem;padding:.2rem;margin-bottom:.6rem}
#zoom button{border:0;border-radius:6rem;min-width:2.75rem;height:2.5rem;background:#fff;color:var(--teal);font-weight:800;font-size:1rem;cursor:pointer}
#zoom #zv{background:none;color:#fff;min-width:3.6rem}
#tabs{flex-wrap:wrap}
main{max-width:64rem}
#app{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:1rem;align-items:start}
#pane{max-width:40rem;width:100%;margin:0 auto}
#units{background:#fff;border:2px solid var(--line);border-radius:1.25rem;padding:.5rem;display:flex;flex-direction:column;gap:.35rem;position:sticky;top:.75rem;max-height:calc(100vh - 1.5rem);overflow-y:auto}
#units::before{content:"📚 Danh sách bài học";font-weight:800;color:var(--mut);padding:.4rem .6rem;font-size:.9rem}
#units button{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;padding:.5rem .6rem;border:2px solid transparent;border-radius:.9rem;background:#fff;color:var(--ink);cursor:pointer;position:relative}
#units button:hover{background:var(--bg)}
#units button.on{background:var(--sun);border-color:var(--sun)}
#units b{flex:none;width:2rem;height:2rem;border-radius:.6rem;background:var(--bg);display:grid;place-items:center}
#units .on b{background:#fff}
#units span{flex:1;min-width:0;line-height:1.25}
#units strong{display:block;font-size:.95rem}
#units small{color:var(--mut);font-weight:700;font-size:.8rem}
#units .on small{color:#5a4200}
#units i{font-style:normal;font-size:1.3rem}
#units .lk::after{content:"🔒";font-size:.8rem}
.nw main{max-width:36rem}
.nw #app{display:block}
.nw #units{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding:.45rem;margin-bottom:.6rem}
.nw #units::before{display:none}
.nw #units button{flex:none;width:auto;padding:.3rem}
.nw #units span,.nw #units i{display:none}
.nw #units b{width:2.4rem;height:2.4rem}
.nw #units .lk::after{position:absolute;right:-.25rem;top:-.4rem}
#tabs button{flex:1 1 auto}

header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.3rem .6rem;padding:.4rem .9rem}
header h1{font-size:1.1rem;flex:1;text-align:left;white-space:nowrap}
#stat{margin:0;padding:.15rem .7rem;font-size:.8rem}
#zoom{margin:0;padding:.15rem;gap:.15rem}
#zoom button{min-width:2.4rem;height:2.1rem;font-size:.9rem}
#zoom #zv{min-width:2.9rem}

#mode{display:flex;gap:.25rem;margin-bottom:.5rem;background:#fff;border:2px solid var(--line);border-radius:.875rem;padding:.25rem}
#mode button{flex:1;border:0;background:none;padding:.55rem;border-radius:.625rem;font-weight:800;color:var(--mut);cursor:pointer;font-size:.95rem}
#mode button.on{background:var(--ink);color:#fff}
#pcard{text-align:left}
#pcard h3{margin:.2rem 0 .5rem;text-align:center}
.pbf{display:block;height:100%;background:var(--coral);transition:width .3s}
.lvb{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;padding:.7rem;margin-top:.5rem;border:2px solid var(--line);border-radius:1rem;background:#fff;color:var(--ink);cursor:pointer;font-size:.95rem}
.lvb:hover{border-color:var(--coral);background:var(--bg)}
.lvb i{font-style:normal;font-size:1.7rem}
.lvb span{flex:1;min-width:0}
.lvb small{display:block;color:var(--mut);font-weight:600}
.lvb em{font-style:normal;font-weight:800;color:#118a4e;white-space:nowrap}
.qi{color:var(--mut);font-weight:800;font-size:.85rem;margin:.6rem 0 .2rem}
.qp{font-size:1.35rem;font-weight:800;text-align:center;margin:.5rem 0 .8rem;line-height:1.4;word-break:break-word}
.qp small{display:block;font-size:.95rem;color:var(--mut);font-weight:700;margin-top:.3rem}
.op{display:block;width:100%;text-align:left;margin-top:.45rem;padding:.7rem .8rem;border:2px solid var(--line);border-radius:.9rem;background:#fff;color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer}
.op:hover{border-color:var(--coral)}
.op.ok{background:#d9f5e5;border-color:#27ae60}
.op.no{background:#fde0dc;border-color:#c0392b}
.az{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;min-height:3rem;padding:.5rem;border-radius:.9rem}
#paz{border:2px dashed var(--line);margin-bottom:.6rem}
.tk{border:2px solid var(--line);background:#fff;border-radius:.7rem;padding:.45rem .7rem;font-weight:800;font-size:1.05rem;color:var(--ink);cursor:pointer;box-shadow:0 .2rem 0 var(--line)}
.tk:disabled{opacity:.3;box-shadow:none}
#pcard.d .op,#pcard.d #paz .tk,#pcard.d #pbk .tk{pointer-events:none}
#pf{min-height:1.5rem;font-weight:800;margin:.6rem 0 0;text-align:center}
.pb{display:flex;gap:.5rem;margin-top:.6rem}
.wr{padding:.4rem .6rem;margin-top:.35rem;border-left:4px solid var(--coral);background:var(--bg);border-radius:.5rem;font-weight:700;font-size:.9rem}
#mode button{font-size:.85rem;padding:.55rem .15rem}
#xcard{text-align:left}#xcard h3{margin:.2rem 0 .5rem;text-align:center}
#xcard.d .op,#xcard.d .tk{pointer-events:none}
#mode{flex-wrap:wrap}#mode button{min-width:5.2rem}
.ps{background:var(--bg);border-radius:.8rem;padding:.6rem;margin:.4rem 0;font-weight:600;line-height:1.5;font-size:.95rem}
.rl{background:#fff8dc;border:2px solid #f3dd8b;border-radius:1rem;padding:.7rem;font-weight:700;font-size:.92rem;line-height:1.5;margin-bottom:.4rem}
.op.sel{background:var(--sky);border-color:#2d7fd3}.op:disabled{cursor:default}
#xcard .eg{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}#xcard .eg .op{text-align:center;font-size:2rem;padding:.4rem 0;margin-top:0}
#xcard .gp{line-height:2.4}#xcard .gp input{display:inline-block;width:8.5rem;margin:0 .15rem;padding:.2rem .4rem;font-size:1rem;text-align:center}
</style>
</head>
<body>
<header><h1>🌟 Tiếng Anh lớp 11</h1><div id="stat"></div><div id="zoom"><button id="zm" aria-label="Thu nhỏ chữ">A−</button><button id="zv" aria-label="Về cỡ mặc định">100%</button><button id="zp" aria-label="Phóng to chữ">A+</button></div></header>
<main><div id="app">
<nav id="units" aria-label="Danh sách bài học"></nav>
<div id="pane">
<div id="utitle"></div>
<div id="mode"><button data-m="0" class="on">🃏 Thẻ học</button><button data-m="1">✍️ Luyện tập</button><button data-m="2">📘 Ngữ pháp</button><button data-m="3">🎧 Luyện nghe</button><button data-m="4">📝 Kiểm tra</button></div>
<div id="tabs">
<button data-t="0" class="on">Tất cả</button><button data-t="1">Từ chính</button><button data-t="2">Mở rộng</button><button data-t="3">Mẫu câu</button>
</div>
<section class="card" id="card">
<div class="bar"><i id="fill"></i></div>
<div id="emoji"></div><span id="tag"></span>
<h2 id="w"></h2><div id="ipa"></div><div id="vn"></div>
<p id="res" aria-live="polite"></p>
<div class="row"><button class="b1" id="bl">🔊 Nghe</button><button class="b2" id="bs">🎙 Đọc</button></div>
<div class="row"><button class="b4" id="bp" aria-label="Từ trước">◀</button><button class="b3" id="know">⭐ Đã thuộc</button><button class="b4" id="bn" aria-label="Từ sau">▶</button></div>
<p id="cnt"></p>
</section>
<section class="card" id="pcard" style="display:none"></section>
<section class="card" id="xcard" style="display:none"></section>
<button class="big" id="tg">👨‍🏫 Chế độ giáo viên (thêm từ)</button>
<div id="teach">
<h3>Thêm từ vào Unit đang chọn</h3>
<input id="nw" placeholder="Từ tiếng Anh"><input id="ni" placeholder="Phiên âm IPA (không bắt buộc)"><input id="nm" placeholder="Nghĩa tiếng Việt">
<button class="big add" id="ba">➕ Lưu từ</button><p id="msg"></p>
</div>
<p id="note"></p>
</div></div>
</main>
<div id="lock"><div class="lc">
<h2>🔒 Unit đã khóa</h2>
<p style="color:#5f7a84">Unit 1 dùng thử miễn phí. Nhập mật khẩu để mở Unit 2 – 10.</p>
<input type="password" id="pw" placeholder="Nhập mật khẩu bản quyền...">
<button class="big b1" id="bk" style="width:100%;margin-bottom:.5rem">🔓 Mở khóa</button>
<button class="big b4" id="bx" style="width:100%">Để sau</button>
<p id="err"></p>
</div></div>
<script>
const FREE=1,PW="tienhuong28011981",$=id=>document.getElementById(id);
// Dữ liệu Tiếng Anh lớp 11 - Global Success (10 Units - Mở rộng từ vựng & câu)
const D=[
  ["A long and healthy life", "Cuộc sống trường thọ & khỏe mạnh", "🥗", "🥗|diet|ˈdaɪət|chế độ ăn uống;🏃|exercise|ˈeksəsaɪz|tập thể dục;⏳|life expectancy|laɪf ɪkˈspektənsi|tuổi thọ;🔄|regular|ˈreɡjələ|thường xuyên;🧅|ingredient|ɪnˈɡriːdiənt|nguyên liệu;💊|nutrient|ˈnjuːtriənt|chất dinh dưỡng;🏋️|workout|ˈwɜːkaʊt|buổi tập luyện;💪|strength|streŋθ|sức mạnh;🩺|treat|triːt|điều trị;👨‍⚕️|examine|ɪɡˈzæmɪn|khám bệnh;🏃|fitness|ˈfɪtnəs|sự sung sức;🕰️|habit|ˈhæbɪt|thói quen;🧘|meditation|ˌmedɪˈteɪʃn|thiền;⚖️|balanced|ˈbælənst|cân bằng;🦠|infectious|ɪnˈfekʃəs|lây nhiễm", "💊|antibiotic|ˌæntibaɪˈɒtɪk|thuốc kháng sinh;💉|vaccine|ˈvæksiːn|vắc-xin;📈|lifespan|ˈlaɪfspæn|tuổi thọ;🛡️|immune system|ɪˈmjuːn ˈsɪstəm|hệ miễn dịch;🌿|remedy|ˈremədi|phương thuốc;😌|relieve|rɪˈliːv|làm dịu;📝|prescription|prɪˈskrɪpʃn|đơn thuốc;🤕|swelling|ˈswelɪŋ|sưng tấy;🤒|symptom|ˈsɪmptəm|triệu chứng;❤️‍🩹|recovery|rɪˈkʌvəri|sự phục hồi", "💬|A balanced diet and regular exercise are essential for a long life.||Một chế độ ăn uống cân bằng và tập thể dục thường xuyên là rất cần thiết cho một cuộc sống trường thọ.;💬|Antibiotics are used to treat bacterial infections.||Thuốc kháng sinh được sử dụng để điều trị nhiễm khuẩn.;💬|He practices meditation every morning to relieve stress.||Anh ấy tập thiền mỗi sáng để giảm căng thẳng.;💬|The doctor examined the patient and wrote a prescription.||Bác sĩ đã khám cho bệnh nhân và kê đơn thuốc.;💬|Vaccines help our immune system fight against diseases.||Vắc-xin giúp hệ miễn dịch của chúng ta chống lại bệnh tật."],
  ["The generation gap", "Khoảng cách thế hệ", "👨‍👩‍👧", "👨‍👩‍👧|generation gap|ˌdʒenəˈreɪʃn ɡæp|khoảng cách thế hệ;⚔️|conflict|ˈkɒnflɪkt|sự xung đột;🏠|nuclear family|ˈnjuːkliə ˈfæməli|gia đình hạt nhân;👵|extended family|ɪkˈstendɪd ˈfæməli|gia đình đa thế hệ;🗣️|argument|ˈɑːɡjumənt|cuộc cãi vã;🙏|respect|rɪˈspekt|tôn trọng;🧠|characteristic|ˌkærəktəˈrɪstɪk|đặc điểm;😠|strict|strɪkt|nghiêm khắc;🛑|impose|ɪmˈpəʊz|áp đặt;👁️|viewpoint|ˈvjuːpɔɪnt|quan điểm;🍽️|table manners|ˈteɪbl ˈmænəz|phép tắc ăn uống;🧗|independent|ˌɪndɪˈpendənt|độc lập;🕰️|conservative|kənˈsɜːvətɪv|bảo thủ;👐|open-minded|ˌəʊpən ˈmaɪndɪd|cởi mở;🏆|overcome|ˌəʊvəˈkʌm|vượt qua", "📱|electronic device|ɪˌlekˈtrɒnɪk dɪˈvaɪs|thiết bị điện tử;⏰|curfew|ˈkɜːfjuː|giờ giới nghiêm;🧹|chore|tʃɔː|việc vặt trong nhà;👣|footstep|ˈfʊtstep|dấu chân, bước đi;📜|norm|nɔːm|chuẩn mực;✅|permission|pəˈmɪʃn|sự cho phép;📏|standard|ˈstændəd|tiêu chuẩn;🛑|objection|əbˈdʒekʃn|sự phản đối;🙇|respectful|rɪˈspektfl|tôn trọng, lễ phép;🏮|traditional|trəˈdɪʃənl|truyền thống", "💬|The generation gap can cause conflicts between parents and children.||Khoảng cách thế hệ có thể gây ra xung đột giữa cha mẹ và con cái.;💬|Parents should not impose their viewpoints on their children.||Cha mẹ không nên áp đặt quan điểm của mình lên con cái.;💬|Having good table manners is a social norm.||Có phép tắc ăn uống tốt là một chuẩn mực xã hội.;💬|He is trying to overcome his conservative mindset.||Anh ấy đang cố gắng vượt qua tư duy bảo thủ của mình.;💬|Open-minded people are willing to listen to others' opinions.||Những người cởi mở thì sẵn sàng lắng nghe ý kiến của người khác."],
  ["Cities of the future", "Các thành phố trong tương lai", "🏙️", "🏙️|smart city|smɑːt ˈsɪti|thành phố thông minh;🏢|skyscraper|ˈskaɪskreɪpə|nhà chọc trời;🌿|sustainable|səˈsteɪnəbl|bền vững;🏡|liveable|ˈlɪvəbl|đáng sống;🛣️|infrastructure|ˈɪnfrəstrʌktʃə|cơ sở hạ tầng;📡|sensor|ˈsensə|cảm biến;♻️|eco-friendly|ˌiːkəʊ ˈfrendli|thân thiện môi trường;👣|carbon footprint|ˌkɑːbən ˈfʊtprɪnt|dấu chân carbon;🧑‍🤝‍🧑|inhabitant|ɪnˈhæbɪtənt|cư dân;🏙️|high-rise|ˈhaɪ raɪz|nhà cao tầng;🚶|pedestrian|pəˈdestriən|người đi bộ;🚌|public transport|ˈpʌblɪk ˈtrænspɔːt|giao thông công cộng;🌆|urban|ˈɜːbən|thuộc đô thị;☀️|renewable|rɪˈnjuːəbl|có thể tái tạo;⭐|quality|ˈkwɒləti|chất lượng", "⚙️|operate|ˈɒpəreɪt|vận hành;🔍|detect|dɪˈtekt|phát hiện;🔄|automatically|ˌɔːtəˈmætɪkli|một cách tự động;⬆️|upgrade|ˌʌpˈɡreɪd|nâng cấp;🌳|green space|ɡriːn speɪs|không gian xanh;📈|urbanisation|ˌɜːbənaɪˈzeɪʃn|đô thị hóa;🚆|commuter|kəˈmjuːtə|người đi làm xa;👨‍👩‍👧|overcrowding|ˌəʊvəˈkraʊdɪŋ|tình trạng quá tải;🏠|dweller|ˈdwelə|cư dân;💨|emission|ɪˈmɪʃn|khí thải", "💬|Smart cities use sensors to operate public transport efficiently.||Các thành phố thông minh sử dụng cảm biến để vận hành giao thông công cộng hiệu quả.;💬|We need to upgrade our urban infrastructure for a sustainable future.||Chúng ta cần nâng cấp cơ sở hạ tầng đô thị cho một tương lai bền vững.;💬|Eco-friendly technologies help reduce our carbon footprint.||Các công nghệ thân thiện với môi trường giúp giảm dấu chân carbon.;💬|Pedestrians and commuters will have more green spaces.||Người đi bộ và người đi làm sẽ có nhiều không gian xanh hơn.;💬|Overcrowding is a major issue in modern high-rise cities.||Tình trạng quá tải là một vấn đề lớn ở các thành phố cao tầng hiện đại."],
  ["ASEAN and Viet Nam", "ASEAN và Việt Nam", "🤝", "🤝|ASEAN|ˈæsiæn|Hiệp hội các quốc gia Đông Nam Á;🇻🇳|member state|ˈmembə steɪt|quốc gia thành viên;📜|charter|ˈtʃɑːtə|hiến chương;🤝|association|əˌsəʊʃiˈeɪʃn|hiệp hội;🏢|bloc|blɒk|khối;🤝|cooperation|kəʊˌɒpəˈreɪʃn|sự hợp tác;📈|economy|ɪˈkɒnəmi|nền kinh tế;⚖️|stability|stəˈbɪləti|sự ổn định;🎭|cultural|ˈkʌltʃərəl|thuộc văn hóa;📜|principle|ˈprɪnsəpl|nguyên tắc;🆔|identity|aɪˈdentəti|bản sắc;🚫|interference|ˌɪntəˈfɪərəns|sự can thiệp;👑|leadership|ˈliːdəʃɪp|khả năng lãnh đạo;🚀|progress|ˈprəʊɡres|sự tiến bộ;🎓|scholarship|ˈskɒləʃɪp|học bổng", "👑|dominate|ˈdɒmɪneɪt|chiếm ưu thế;🔗|integration|ˌɪntɪˈɡreɪʃn|sự hội nhập;🤝|solidarity|ˌsɒlɪˈdærəti|sự đoàn kết;🤝|mutual|ˈmjuːtʃuəl|lẫn nhau;🌏|region|ˈriːdʒən|khu vực;🌈|diversity|daɪˈvɜːsəti|sự đa dạng;🛠️|maintain|meɪnˈteɪn|duy trì;📝|proposal|prəˈpəʊzl|đề xuất;🗣️|represent|ˌreprɪˈzent|đại diện;🤝|relation|rɪˈleɪʃn|mối quan hệ", "💬|Viet Nam has been a member state of ASEAN since 1995.||Việt Nam đã là một quốc gia thành viên của ASEAN từ năm 1995.;💬|The ASEAN Charter promotes peace and stability in the region.||Hiến chương ASEAN thúc đẩy hòa bình và ổn định trong khu vực.;💬|Economic integration is a key principle of the bloc.||Hội nhập kinh tế là một nguyên tắc then chốt của khối.;💬|We share mutual respect and maintain solidarity.||Chúng ta chia sẻ sự tôn trọng lẫn nhau và duy trì tình đoàn kết.;💬|Scholarships are offered to promote cultural diversity.||Học bổng được cấp để thúc đẩy sự đa dạng văn hóa."],
  ["Global warming", "Sự nóng lên toàn cầu", "🌡️", "🌡️|global warming|ˈɡləʊbl ˈwɔːmɪŋ|sự nóng lên toàn cầu;🏭|greenhouse gas|ˈɡriːnhaʊs ɡæs|khí nhà kính;💨|emission|ɪˈmɪʃn|khí thải;🪓|deforestation|ˌdiːˌfɒrɪˈsteɪʃn|sự tàn phá rừng;🪨|fossil fuel|ˈfɒsl fjuːəl|nhiên liệu hóa thạch;🌤️|climate change|ˈklaɪmət tʃeɪndʒ|biến đổi khí hậu;🧽|absorb|əbˈzɔːb|hấp thụ;🚀|release|rɪˈliːs|thải ra, giải phóng;💥|catastrophic|ˌkætəˈstrɒfɪk|thảm khốc;🌿|ecosystem|ˈiːkəʊsɪstəm|hệ sinh thái;👣|footprint|ˈfʊtprɪnt|dấu chân;🥅|capture|ˈkæptʃə|bắt giữ;⚠️|severe|sɪˈvɪə|nghiêm trọng;📉|consequence|ˈkɒnsɪkwəns|hậu quả;☁️|atmosphere|ˈætməsfɪə|khí quyển", "🌪️|extreme weather|ɪkˈstriːm ˈweðə|thời tiết khắc nghiệt;🥵|heatwave|ˈhiːtweɪv|đợt nắng nóng;🌾|crop|krɒp|vụ mùa;🧠|awareness|əˈweənəs|nhận thức;🦠|infectious|ɪnˈfekʃəs|lây nhiễm;🛑|disrupt|dɪsˈrʌpt|làm gián đoạn;🪤|trap|træp|giữ lại, mắc kẹt;🔄|switch|swɪtʃ|chuyển đổi;💡|alternative|ɔːlˈtɜːnətɪv|sự thay thế;🌍|ecological|ˌiːkəˈlɒdʒɪkl|thuộc sinh thái", "💬|Greenhouse gas emissions trap heat in the atmosphere.||Phát thải khí nhà kính giữ lại nhiệt trong bầu khí quyển.;💬|Deforestation and burning fossil fuels cause global warming.||Tàn phá rừng và đốt nhiên liệu hóa thạch gây ra sự nóng lên toàn cầu.;💬|Climate change leads to extreme weather and heatwaves.||Biến đổi khí hậu dẫn đến thời tiết khắc nghiệt và các đợt nắng nóng.;💬|We must switch to alternative energy to protect the ecosystem.||Chúng ta phải chuyển sang năng lượng thay thế để bảo vệ hệ sinh thái.;💬|Catastrophic consequences will disrupt our ecological balance.||Những hậu quả thảm khốc sẽ làm gián đoạn sự cân bằng sinh thái của chúng ta."],

["To-infinitive clauses","To V dùng sau decide/want/need/hope; sau the first/second/last/only; sau danh từ (something to eat); chỉ mục đích; sau It is + adj.",["She decided ___ a volunteer at the heritage site.|to become|becoming/become/became|decide + to V.","He was the first student ___ the museum.|to visit|visiting/visited/visit|the first + N + to V.","I have a lot of work ___ today.|to do|doing/do/done|N + to V: việc phải làm.","We need ___ our traditions for future generations.|to preserve|preserving/preserve/preserved|need + to V.","It is important ___ historic buildings.|to protect|protecting/protect/protected|It is + adj + to V.","R|Nối bằng to V chỉ mục đích: She went to the museum. She wanted to learn about local history.|she went to the museum to learn about local history|wanted to → to V chỉ mục đích."]],
["Perfect gerunds & perfect participle clauses","Having + V3 (chủ động) và Having been + V3 (bị động): hành động xảy ra trước, cùng chủ ngữ với mệnh đề chính. Perfect gerund: having + V3 sau giới từ/động từ (proud of having done).",["___ the exam, she left the room quietly.|Having finished|Be finished/To finish/Having been finished|Hai hành động nối tiếp, cùng chủ ngữ: Having + V3.","___ the programme, he found a job.|Having completed|Complete/To complete/Having complete|Hành động xảy ra trước: Having + V3.","She is proud of ___ the top university last year.|having entered|enter/to entering/having enter|giới từ + having + V3.","___ for three years, he decided to quit his job.|Having worked|Work/To work/Having been worked|Having + V3 (chủ động).","___ by the college, the students were very happy.|Having been accepted|Having accepted/Accepting/To accept|Bị động hoàn thành: Having been + V3.","R|Viết lại với mệnh đề phân từ hoàn thành: After she had passed the exam, she applied for university.|having passed the exam she applied for university|After + had + V3 → Having + V3."]],
["Cleft sentences","It is/was + từ/cụm được nhấn mạnh + that/who + mệnh đề. who cho người, that cho người/vật/trạng ngữ.",["It was Nam ___ won the first prize.|who|which/whose/what|Nhấn mạnh người → who.","It is independence ___ every teenager wants.|that|who/whose/where|Nhấn mạnh vật → that.","It was on Sunday ___ we cleaned the house.|that|who/which/whose|Nhấn mạnh trạng ngữ thời gian → that.","It is self-confidence ___ helps young people live independently.|that|who/whose/when|Nhấn mạnh vật làm chủ ngữ → that.","___ was my sister that solved the problem.|It|This/There/What|Cấu trúc chẻ: It was ... that.","R|Viết câu chẻ nhấn mạnh 'Mai': Mai made the decision to live alone.|it was mai who made the decision to live alone~it was mai that made the decision to live alone|It was + Mai + who/that + ..."]],
["Linking words and phrases","however, nevertheless (tương phản); moreover, in addition (bổ sung); therefore, as a result (kết quả); although + mệnh đề; despite + N/V-ing.",["He studied hard; ___, he failed the exam.|however|therefore/moreover/besides|However: tương phản.","___ she was tired, she kept working.|Although|Because/So/However|Although + mệnh đề (tương phản).","Poverty is a serious problem. ___, it causes many other social issues.|Moreover|However/Although/Despite|Moreover: bổ sung ý.","___ the heavy rain, the volunteers continued helping.|Despite|Although/However/Because|Despite + cụm danh từ.","He didn't have a job. ___, he couldn't pay his rent.|As a result|However/Although/Despite|As a result: chỉ kết quả.","R|Nối bằng 'although': The village is poor. The people are happy.|although the village is poor the people are happy~the people are happy although the village is poor|Although + mệnh đề tương phản."]],

function lsay(a){if(!TTS)return;speechSynthesis.cancel();a.forEach(([w,t])=>{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;u.pitch=VP2[w]||1;speechSynthesis.speak(u)})}
const lsplit=s=>s.match(/[^.?!]+[.?!]*/g).map(x=>["",x.trim()]);
function lstart(){TTS&&speechSynthesis.cancel();const b=ls.get("gs11_lis",{}),c=$("xcard");c.classList.remove("d");
c.innerHTML=`<h3>🎧 Luyện kỹ năng nghe</h3><p class="qi" style="text-align:center">4 cấp độ · mỗi cấp 1 bài nghe với hình thức khác nhau${TTS?"":" · ⚠️ Trình duyệt chưa hỗ trợ giọng đọc, hãy dùng Google Chrome"}</p>`+LN.map((t,k)=>`<button class="lvb" data-k="${k}"><i>${LV[k][0]}</i><span><strong>${LV[k][1]} · ${t.n}</strong><small>${t.d}</small></span><em>${k>0&&!unlocked()?"🔒":b[k]!=null?b[k]+"%":""}</em></button>`).join("");
c.querySelectorAll(".lvb").forEach(x=>x.onclick=()=>{const k=+x.dataset.k;if(k>0&&!unlocked()){lk();return}lbegin(k)})}
function lbegin(k){TTS&&speechSynthesis.cancel();ln=k;lp=0;const t=LN[k],c=$("xcard");LQ=[];LG=[];let au=null,h="";
const blk=(j,q,body)=>`<div class="tq" data-i="${j}"><p class="qp" style="font-size:1rem;text-align:left">Câu ${j+1}. ${q}</p>${body}</div>`;
if(t.pic)h=t.qs.map((q,j)=>{const o=sh(q.slice(1));LQ.push({a:q[1],o,au:[["",q[0]]]});return blk(j,`<button class="tk pl" data-i="${j}">🔊 Nghe</button> Chọn hình đúng`,`<div class="eg">${o.map((x,y)=>`<button class="op" data-j="${y}">${x}</button>`).join("")}</div>`)}).join("");
else{au=t.au||lsplit(t.tx.replace(/\{([^}|]+)[^}]*\}/g,"$1"));
h=`<div class="ps" style="text-align:center"><button class="big b1" id="lpb"></button></div>`;
if(t.tx&&!t.qs){let n=0;h+=`<div class="ps gp">${esc(t.tx).replace(/\{([^}]+)\}/g,(m,a)=>{LG.push(a.split("|"));return`<input data-g="${n}" placeholder="(${++n})" autocomplete="off" autocapitalize="none" spellcheck="false">`})}</div>`}
else h+=t.qs.map((s,j)=>{const[q,a,...d]=s.split("|");let o,p=q,r=a;if(q=="T"||q=="F"){o=["True","False"];r=q=="T"?"True":"False";p="True or False? "+esc(a)}else{o=sh([a,...d]);p=esc(q)}
LQ.push({a:r,o});return blk(j,p,o.map((x,y)=>`<button class="op" data-j="${y}">${"ABCD"[y]}. ${esc(x)}</button>`).join(""))}).join("")}
c.innerHTML=`<h3>${LV[k][0]} ${t.n}</h3>${h}<div class="pb"><button class="big b2" id="ls">✔ Nộp bài</button></div><div id="lr"></div>`;
const upd=()=>{const b=$("lpb");if(!b)return;const left=t.pl-lp;b.textContent=left>0?`▶ Nghe bài (còn ${left} lần)`:"🔇 Hết lượt nghe";b.disabled=left<=0};
if(!t.pic){upd();$("lpb").onclick=()=>{if(TTS&&(speechSynthesis.speaking||speechSynthesis.pending)){speechSynthesis.cancel();return}if(lp>=t.pl)return;lp++;lsay(au);upd()}}
c.querySelectorAll(".pl").forEach(b=>b.onclick=()=>lsay(LQ[+b.dataset.i].au));
c.querySelectorAll(".tq").forEach(x=>x.querySelectorAll(".op").forEach(b=>b.onclick=()=>{LQ[+x.dataset.i].v=+b.dataset.j;x.querySelectorAll(".op").forEach(y=>y.classList.toggle("sel",y==b))}));
$("ls").onclick=lsubmit;scrollTo(0,0)}
function lsubmit(){TTS&&speechSynthesis.cancel();const t=LN[ln];let c=0,n=LQ.length;
document.querySelectorAll("#xcard .tq").forEach(x=>{const q=LQ[+x.dataset.i];x.querySelectorAll(".op").forEach((b,j)=>{b.disabled=true;if(q.o[j]==q.a)b.classList.add("ok");else if(j==q.v)b.classList.add("no")});if(q.o[q.v]==q.a)c++});
if(LG.length){n=LG.length;document.querySelectorAll("#xcard .gp input").forEach(x=>{const a=LG[+x.dataset.g],r=a.some(z=>nz(z)==nz(x.value));x.disabled=true;x.style.borderColor=r?"#27ae60":"#c0392b";if(r)c++;else x.value=x.value+" → "+a[0]})}
const p=Math.round(c/n*100),b=ls.get("gs11_lis",{});if(p>(b[ln]||0)){b[ln]=p;ls.set("gs11_lis",b)}
const tr=t.pic?t.qs.map((q,j)=>`${j+1}. ${esc(q[0])}`).join("<br>"):(t.au||lsplit(t.tx.replace(/\{([^}|]+)[^}]*\}/g,"$1"))).map(([w,s])=>(w?`<b>${w}:</b> `:"")+esc(s)).join("<br>");
$("lr").innerHTML=`<h3>${p>=80?"🏆":p>=60?"👍":"💪"} ${c}/${n} câu đúng (${p}%)</h3><div class="rl"><b>📄 Văn bản bài nghe:</b><br>${tr}</div><div class="pb"><button class="big b2" id="l1">🔁 Làm lại</button>${p>=80&&ln<3?'<button class="big b1" id="l2">⬆️ Lên cấp</button>':""}</div><div class="pb"><button class="big b4" id="l3">🎚️ Chọn cấp khác</button></div>`;
$("ls").style.display="none";$("l1").onclick=()=>lbegin(ln);if($("l2"))$("l2").onclick=()=>{const k=ln+1;if(!unlocked()){lk();return}lbegin(k)};$("l3").onclick=lstart;$("lr").scrollIntoView({behavior:"smooth",block:"start"})}

load();
</script>
</body>
</html>
